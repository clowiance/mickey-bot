bot:
  username: ${BOT_USERNAME}
  token: ${BOT_TOKEN}
  dev-ids: ${BOT_DEV_IDS}
  target-group-username: ${BOT_TARGET_GROUP_USERNAME}

spring:
  datasource:
    url: jdbc:sqlite:mickey.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    dev.clowiance.mickey: DEBUG
