bot:
  username: ${BOT_USERNAME}
  token: ${BOT_TOKEN}
  dev-ids: ${BOT_DEV_IDS}

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:sqlite:mickey.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    open-in-view: false
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    dev.clowiance.mickey: DEBUG
