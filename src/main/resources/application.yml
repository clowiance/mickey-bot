bot:
  username: ${BOT_USERNAME}
  token: ${BOT_TOKEN}
  dev-ids: ${BOT_DEV_IDS}
  polling-enabled: ${BOT_POLLING_ENABLED:true}

analytics:
  python-command: ${PYTHON_COMMAND:python}
  timeout-seconds: ${CHART_TIMEOUT_SECONDS:15}

audit:
  retention-days: ${AUDIT_RETENTION_DAYS:30}
  store-message-content: ${AUDIT_STORE_MESSAGE_CONTENT:false}

admin-panel:
  enabled: ${ADMIN_PANEL_ENABLED:false}
  username: ${ADMIN_PANEL_USERNAME:admin}
  password: ${ADMIN_PANEL_PASSWORD:}

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:sqlite:mickey.db?journal_mode=WAL&busy_timeout=10000&foreign_keys=on}
    driver-class-name: org.sqlite.JDBC
    hikari:
      connection-init-sql: PRAGMA busy_timeout=10000
  jpa:
    open-in-view: false
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

logging:
  level:
    root: INFO
    dev.clowiance.mickey: DEBUG
